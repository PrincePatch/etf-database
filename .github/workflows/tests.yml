name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The offline suite cannot fail on its own, but the network tests can: half
    # these endpoints are undocumented and rotate their URLs without notice.
    # A weekly run is how we find out before a refresh does.
    - cron: '0 6 * * 1'

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -m "not network"

  endpoints:
    # Only on the schedule and on demand. Running live-endpoint tests on every
    # push would hammer public services for no signal -- the code under test
    # has not changed, only the upstream can break.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -m network
